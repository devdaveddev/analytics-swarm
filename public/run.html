<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Running analysis — Analytics Swarm</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2.5"/><rect x="13" y="2" width="9" height="5" rx="2.5"/><rect x="13" y="9" width="9" height="13" rx="2.5"/><rect x="2" y="13" width="9" height="9" rx="2.5"/></svg> <span>Analytics Swarm</span></a>
    <nav><a href="/new">New analysis</a></nav>
  </header>

  <main id="main" class="container narrow">
    <p class="eyebrow">Control agent</p>
    <h1 id="company">Agent swarm</h1>
    <p class="lead" id="status">Connecting to the control agent…</p>
    <div class="notice error" id="error" hidden></div>

    <ol class="agents" id="agents"></ol>

    <details class="card log-card" open>
      <summary>Event log</summary>
      <ul class="log" id="log"></ul>
    </details>

    <p class="cta-row" id="done-actions" hidden>
      <a class="btn" id="open-dashboard" href="/">Open dashboard</a>
    </p>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/run.js"></script>
</body>
</html>
